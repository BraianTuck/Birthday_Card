<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Captura Seccion 1</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { margin: 0; padding: 24px; display: flex; justify-content: center; background: #f8e9f1; }
    .scene { width: 100%; max-width: 980px; min-height: auto; }
    .hero-layout { display: block; }
    .poster-frame { margin: 0; }
  </style>
</head>
<body>
  <main class="scene">
    <div class="hero-layout">
      <div class="poster-frame">
        <section class="poster" aria-label="Invitacion de cumpleanos estilo collage">
          <img class="layer sticker num3" src="imagenes/3.png" alt="Globo con numero tres" draggable="false">
          <img class="layer sticker num0" src="imagenes/0.png" alt="Globo con numero cero" draggable="false">
          <img class="layer sticker nina" src="imagenes/ni&#241;a.png" alt="Nina con sombrero de fiesta" draggable="false">

          <img class="layer fondo" src="imagenes/fondo.png" alt="Fondo decorativo con flores y pastel" draggable="false">
          <img class="layer sticker globos" src="imagenes/globos.png" alt="Ramo de globos rosas" draggable="false">
          <img class="layer sticker beso" src="imagenes/beso.png" alt="Estampa de labios rosas" draggable="false">
          <img class="layer sticker sorpresa" src="imagenes/mujer_sorprendida.png" alt="Mujer sorprendida" draggable="false">
          <img class="layer sticker happy" src="imagenes/happy_birthday.png" alt="Texto birthday party estilo recortes" draggable="false">
          <img class="layer sticker cartel" src="imagenes/cartel_30.png" alt="Cartel de treinta coqueta prospera" draggable="false">
          <img class="layer sticker princess" src="imagenes/princess.png" alt="Nina vestida de princesa" draggable="false">
          <img class="layer sticker corona" src="imagenes/ni&#241;a_corona.png" alt="Mujer con corona" draggable="false">
          <img class="layer sticker anniston" src="imagenes/anniston.png" alt="Mujer brindando" draggable="false">
        </section>
      </div>
    </div>
  </main>
</body>
</html>
